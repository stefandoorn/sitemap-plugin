services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    sylius.sitemap_provider.data.product:
        class: SitemapPlugin\Provider\Data\ProductDataProvider
        arguments:
            - '@sylius.repository.product'

    sylius.sitemap_provider.product:
        class: SitemapPlugin\Provider\ProductUrlProvider
        arguments:
            - '@sylius.sitemap_provider.data.product'
            - '@router'
            - '@sylius.sitemap_url_factory'
            - '@sylius.sitemap_url_alternative_factory'
            - '@sylius.context.locale'
            - '@sylius.sitemap.generator.product_images_to_sitemap_images_collection'
        tags:
            - { name: sylius.sitemap_provider }
